[tool.poetry]
name = "tent-pole"
version = "0.2.0"
description = ""
authors = ["Phillip Lord"]
## Poetry's default packaging only picks up tent_pole/**/*.py -- these
## are shipped Makefile fragments and support scripts, not Python
## source, so they need an explicit include or they'd silently be
## missing from the built wheel/sdist.
include = ["tent_pole/make-rules/**/*", "tent_pole/bin/**/*"]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
canvasapi = "^3.6.0"
click = "^7.1.2"
appdirs = "^1.4.4"
toml = "^0.10.1"
dpath = "^2.0.1"
stringcase = "^1.2.0"
panflute = "^2.3.1"
pygments = "^2.19"

[tool.poetry.scripts]
tent-pole = "tent_pole.main:main"
canvas-filter = "tent_pole.canvas_filter:main"
code-include-filter = "tent_pole.code_include_filter:main"
include-deps-filter = "tent_pole.include_deps_filter:main"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pre-commit = "^4.6.2"

[tool.pytest.ini_options]
markers = [
    "canvas: requires network access and a configured Canvas sandbox course",
]
addopts = "-m 'not canvas'"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
