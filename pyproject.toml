[tool.poetry]
name = "tent-pole"
version = "0.1.0"
description = ""
authors = ["Phillip Lord"]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
canvasapi = "^3.6.0"
click = "^7.1.2"
appdirs = "^1.4.4"
toml = "^0.10.1"
dpath = "^2.0.1"
stringcase = "^1.2.0"

[tool.poetry.scripts]
tent-pole = "tent_pole.main:main"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pre-commit = "^4.6.2"

[tool.pytest.ini_options]
markers = [
    "canvas: requires network access and a configured Canvas sandbox course",
]
addopts = "-m 'not canvas'"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
